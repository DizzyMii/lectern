name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the suite takes under a minute, so anything near this is a hang or a runner that never came
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          # the tests never start Electron, so skip its 100+ MB download
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # the tests use the fake engines, so no claude binary or API key is needed
      - run: node --test test/

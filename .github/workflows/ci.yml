name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          # the tests never start Electron, so skip its 100+ MB download
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # the tests use the fake engines, so no claude binary or API key is needed
      - run: node --test test/
